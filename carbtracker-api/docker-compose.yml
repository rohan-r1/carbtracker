version: '3.8'

services:
  db:
    image: postgres:15
    container_name: carbtracker-db
    environment:
      POSTGRES_USER: carbtracker
      POSTGRES_PASSWORD: carbtracker
      POSTGRES_DB: carbtracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbtracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
